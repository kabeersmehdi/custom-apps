<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Custom Apps</title>
<style>
:root { --bg: #FFFFFF; --fg: #0E0D0C; --muted: #6F6963; --line: #ECE8E3; --accent: #FF6B00; --accent-text: #B84D00; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0B0A09; --fg: #F6F3EF; --muted: #9C958D; --line: #221F1C; --accent: #FF7A1A; --accent-text: #FF9A4D; color-scheme: dark; }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
h1 { margin: 0 0 24px; font-size: 32px; letter-spacing: -0.02em; }
a.app {
  display: block;
  padding: 16px 0;
  border-top: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
}
a.app:last-of-type { border-bottom: 1px solid var(--line); }
a.app strong { display: block; font-size: 18px; }
a.app span { color: var(--muted); font-size: 14px; }
a.app:hover strong { color: var(--accent-text); }
a.app:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>Custom Apps</h1>
  <a class="app" href="day-planner/">
    <strong>Day Blocks</strong>
    <span>Plan the day in time blocks on an Apple-style calendar.</span>
  </a>
</main>
</body>
</html>
