<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Custom Apps</title>
<link rel="icon" type="image/svg+xml" href="day-planner/icon.svg">
<style>
:root { --bg: #F7F5F0; --fg: #1A1A18; --muted: #7F7B74; --line: #E7E3DB; --accent: #F2661A; --accent-text: #B4480B; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121211; --fg: #ECE9E2; --muted: #8E8981; --line: #242320; --accent: #FF7A2A; --accent-text: #FF9A5A; color-scheme: dark; }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
h1 { margin: 0 0 24px; font-size: 32px; letter-spacing: -0.02em; }
a.app {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  gap: 4px 16px;
  align-items: center;
  padding: 16px 0;
  border-top: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
}
a.app:last-of-type { border-bottom: 1px solid var(--line); }
a.app img { grid-row: span 2; width: 44px; height: 44px; }
a.app strong { display: block; font-size: 18px; font-weight: 500; }
a.app span { color: var(--muted); font-size: 14px; }
a.app:hover strong { color: var(--accent-text); }
a.app:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>Custom Apps</h1>
  <a class="app" href="day-planner/">
    <img src="day-planner/icon.svg" alt="">
    <strong>Day Blocks</strong>
    <span>Plan the day in time blocks, with prayer times and a stats view.</span>
  </a>
</main>
</body>
</html>
